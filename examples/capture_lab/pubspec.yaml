name: flutter_capture_lab
description: Windows and Android Flutter automation and dual-channel capture verification.
publish_to: none
version: 1.0.0+1
environment:
  # Flutter 3.44 supplies the controller's minimum Dart 3.12 toolchain.
  sdk: '>=3.12.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
dev_dependencies:
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
