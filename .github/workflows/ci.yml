name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Windows Python ${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check repository and documentation
        run: python -B scripts/check_repository.py
      - name: Test independent Windows capture tool (no app or device)
        run: python -B -m unittest discover -s scripts -p "test_*.py" -v

  flutter:
    name: Flutter analysis and headless tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable long SDK paths on Windows
        if: runner.os == 'Windows'
        # Flutter engine golden-image paths can exceed Windows Git's default limit.
        run: git config --global core.longpaths true
      - name: Get current stable Flutter SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: stable
          path: .cache/flutter
          # Flutter derives its framework version from release tags.
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
      - name: Prepare SDK
        run: |
          echo "$GITHUB_WORKSPACE/.cache/flutter/bin" >> "$GITHUB_PATH"
          .cache/flutter/bin/flutter --version
      - name: Prepare FFmpeg for Dart media tests
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              choco install ffmpeg --yes --no-progress
            else
              # Hosted images have extra apt sources. Bound unreachable mirrors
              # and keep package/service configuration noninteractive in CI.
              apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
              sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" update
              sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install --yes --no-install-recommends ffmpeg
            fi
          fi
          ffmpeg -version
          ffprobe -version
      - name: Resolve fixture dependencies
        working-directory: examples/capture_lab
        run: flutter pub get
      - name: Resolve resident Dart MCP dependencies
        working-directory: tools/automation
        run: dart pub get
      - name: Check resident Dart MCP (no app or device)
        working-directory: tools/automation
        run: |
          dart format --output=none --set-exit-if-changed bin lib test
          dart analyze
          dart test
          mkdir -p build
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dart compile exe bin/automation.dart -o build/automation.exe
          else
            dart compile exe bin/automation.dart -o build/automation
          fi
          dart run bin/check_startup.dart
      - name: Analyze fixture
        working-directory: examples/capture_lab
        run: flutter analyze --no-pub
      - name: Test fixture (headless)
        working-directory: examples/capture_lab
        run: flutter test --no-pub

  native:
    name: Compile Windows capture helper
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure standalone helper
        run: cmake -S tools/window_capture -B tools/window_capture/build -A x64
      - name: Compile (no capture execution)
        run: cmake --build tools/window_capture/build --config Release
